<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel RH - v4 (Com Pix)</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #2980b9;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #c0392b;
            --light: #ecf0f1;
            --dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--secondary);
            padding-bottom: 20px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #bdc3c7;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            border-radius: 5px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover, .menu-btn.active {
            background-color: var(--secondary);
            color: white;
            padding-left: 20px;
        }

        .system-controls {
            margin-top: auto;
            border-top: 1px solid var(--secondary);
            padding-top: 20px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .section {
            display: none;
            animation: fadeIn 0.4s;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { color: var(--dark); border-bottom: 3px solid var(--accent); display: inline-block; padding-bottom: 5px; margin-top: 0; }

        /* Cards & Forms */
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Buttons */
        button.action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 1rem;
            transition: 0.2s;
        }
        button.action-btn:hover { filter: brightness(1.1); }
        
        button.btn-save { background-color: var(--success); width: 100%; margin-top: 10px; }
        button.btn-load { background-color: var(--warning); width: 100%; margin-top: 5px; }
        button.btn-add-func { background-color: var(--success); margin-top: 15px; width: 100%; }
        
        button.btn-copy {
            background-color: #ecf0f1;
            color: #2c3e50;
            border: 1px solid #bdc3c7;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }
        button.btn-copy:hover { background-color: #bdc3c7; }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
            vertical-align: middle;
        }

        th { background-color: var(--secondary); color: white; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
        tr:hover { background-color: #f8f9fa; }

        .info-sub { display: block; font-size: 0.8em; color: #7f8c8d; margin-top: 2px; }
        .info-pix { display: inline-block; font-size: 0.8em; color: #27ae60; background: #e8f8f5; padding: 2px 6px; border-radius: 4px; margin-top: 4px; font-weight: bold;}

        /* Alerts */
        .alert-box {
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🚀 Admin RH</h2>
        <button class="menu-btn active" onclick="showSection('funcionarios')">👥 Funcionários</button>
        <button class="menu-btn" onclick="showSection('presenca')">📅 Lista de Presença</button>
        <button class="menu-btn" onclick="showSection('pagamentos')">💰 Pagamentos</button>
        
        <div class="system-controls">
            <button class="action-btn btn-save" onclick="salvarDados()">💾 Baixar Backup</button>
            <input type="file" id="fileInput" style="display: none;" onchange="carregarDados(this)">
            <button class="action-btn btn-load" onclick="document.getElementById('fileInput').click()">📂 Carregar Backup</button>
        </div>
    </div>

    <div class="main-content">

        <div id="funcionarios" class="section active">
            <h1>Gestão de Equipe</h1>
            
            <div class="card">
                <h3 style="margin-top:0">Cadastrar Novo Funcionário</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome Completo *</label>
                        <input type="text" id="fNome" placeholder="Ex: João da Silva">
                    </div>
                    <div class="form-group">
                        <label>Cargo / Função *</label>
                        <input type="text" id="fCargo" placeholder="Ex: Vendedor">
                    </div>
                    <div class="form-group">
                        <label>Salário Base (R$) *</label>
                        <input type="number" id="fSalario" placeholder="0.00">
                    </div>

                    <div class="form-group">
                        <label>Chave Pix (Opcional)</label>
                        <input type="text" id="fPix" placeholder="CPF, Email, Aleatória...">
                    </div>
                    <div class="form-group">
                        <label>Telefone (Opcional)</label>
                        <input type="text" id="fTel" placeholder="(00) 00000-0000">
                    </div>
                    <div class="form-group">
                        <label>CPF (Opcional)</label>
                        <input type="text" id="fCpf" placeholder="000.000.000-00">
                    </div>
                    <div class="form-group">
                        <label>Data Nascimento (Opcional)</label>
                        <input type="date" id="fNasc">
                    </div>
                    <div class="form-group">
                        <label>Data Entrada (Opcional)</label>
                        <input type="date" id="fEntrada">
                    </div>
                    <div class="form-group">
                        <label>Endereço Completo (Opcional)</label>
                        <input type="text" id="fEnd" placeholder="Rua, Número, Bairro...">
                    </div>
                </div>
                <button class="action-btn btn-add-func" onclick="adicionarFuncionario()">+ Cadastrar Funcionário</button>
            </div>
            
            <table id="tabelaFuncionarios">
                <thead>
                    <tr>
                        <th width="30%">Funcionário / CPF</th>
                        <th width="20%">Cargo / Entrada</th>
                        <th width="25%">Contato / Pix</th>
                        <th width="15%">Salário Base</th>
                        <th width="10%">Ação</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div id="presenca" class="section">
            <h1>Lista de Presença</h1>
            <div class="card">
                <h3>Registrar Dia</h3>
                <div style="display: flex; gap: 10px; align-items: flex-end;">
                    <div class="form-group" style="flex:1">
                        <label>Selecione a Data</label>
                        <input type="date" id="dataPresenca">
                    </div>
                    <button class="action-btn" style="height: 42px;" onclick="carregarListaPresenca()">Carregar Lista</button>
                </div>
            </div>

            <div id="areaPresenca" style="display: none;">
                <table id="tabelaPresenca">
                    <thead>
                        <tr>
                            <th>Funcionário</th>
                            <th>Status</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyPresenca">
                        </tbody>
                </table>
                <button class="action-btn btn-save" style="margin-top: 20px;" onclick="salvarPresencaDia()">✅ Confirmar e Salvar</button>
            </div>
        </div>

        <div id="pagamentos" class="section">
            <h1>Financeiro e Pagamentos</h1>
            <div class="card">
                <h3 style="margin-top:0">Novo Lançamento</h3>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Funcionário</label>
                        <select id="selectFuncionarioPagamento" onchange="mostrarSaldoRestante()">
                            <option value="">Selecione...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data do Pagamento</label>
                        <input type="date" id="dataPagamento" onchange="mostrarSaldoRestante()">
                    </div>
                    <div class="form-group">
                        <label>Valor (R$)</label>
                        <input type="number" id="valorPagamento" placeholder="0.00">
                    </div>
                    <div class="form-group" style="grid-column: span 3;">
                        <label>Descrição</label>
                        <input type="text" id="descPagamento" placeholder="Ex: Adiantamento Quinzenal">
                    </div>
                </div>
                
                <div id="avisoSaldo" class="alert-box"></div>
                <button class="action-btn" style="width: 100%; margin-top:15px;" onclick="lancarPagamento()">Registrar Pagamento</button>
            </div>

            <table id="tabelaPagamentos">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Beneficiário</th>
                        <th>Descrição</th>
                        <th>Valor Pago</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

    </div>

    <script>
        // --- BASE DE DADOS ---
        let db = {
            funcionarios: [],
            presencas: {},
            pagamentos: []
        };

        // --- STARTUP ---
        window.onload = () => {
            const dataSalva = localStorage.getItem('rh_db_v4'); // Versão 4
            if (dataSalva) {
                db = JSON.parse(dataSalva);
                // Migração segura
                db.funcionarios.forEach(f => {
                    if(!f.cpf) f.cpf = '';
                    if(!f.tel) f.tel = '';
                    if(!f.end) f.end = '';
                    if(!f.pix) f.pix = ''; // Garante que existe o campo pix
                    if(!f.nasc) f.nasc = '';
                    if(!f.entrada) f.entrada = '';
                });
            }
            document.getElementById('dataPresenca').valueAsDate = new Date();
            document.getElementById('dataPagamento').valueAsDate = new Date();
            atualizarInterface();
        };

        // --- FORMATADORES ---
        const fmtMoeda = (v) => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        const fmtData = (d) => { if(!d) return '-'; return new Date(d).toLocaleDateString('pt-BR', {timeZone: 'UTC'}); };

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }

        // --- UTILITÁRIO DE CÓPIA ---
        function copiarTexto(texto) {
            // Cria um elemento temporário para copiar
            const el = document.createElement('textarea');
            el.value = texto;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('Chave Pix copiada: ' + texto);
        }

        // --- FUNCIONÁRIOS ---
        function adicionarFuncionario() {
            // Pegando valores
            const nome = document.getElementById('fNome').value;
            const cargo = document.getElementById('fCargo').value;
            const salario = parseFloat(document.getElementById('fSalario').value);
            
            // Campos Opcionais
            const pix = document.getElementById('fPix').value;
            const cpf = document.getElementById('fCpf').value;
            const tel = document.getElementById('fTel').value;
            const nasc = document.getElementById('fNasc').value;
            const entrada = document.getElementById('fEntrada').value;
            const end = document.getElementById('fEnd').value;

            if (!nome || !cargo || isNaN(salario)) return alert("Preencha os campos obrigatórios (*)!");

            const novoFunc = {
                id: Date.now(),
                nome, cargo, salario,
                pix, cpf, tel, nasc, entrada, end
            };

            db.funcionarios.push(novoFunc);
            
            // Limpar formulário
            document.querySelectorAll('#funcionarios input').forEach(input => input.value = '');
            
            salvarLocal();
            atualizarInterface();
            alert("Funcionário cadastrado!");
        }

        function removerFuncionario(id) {
            if(confirm("Deseja realmente remover este funcionário da lista ativa?")) {
                db.funcionarios = db.funcionarios.filter(f => f.id !== id);
                salvarLocal();
                atualizarInterface();
            }
        }

        // --- PRESENÇA ---
        function carregarListaPresenca() {
            const data = document.getElementById('dataPresenca').value;
            if(!data) return alert("Selecione uma data");

            const tbody = document.getElementById('tbodyPresenca');
            tbody.innerHTML = '';
            document.getElementById('areaPresenca').style.display = 'block';

            const registroDia = db.presencas[data] || [];

            db.funcionarios.forEach(f => {
                const saved = registroDia.find(r => r.id === f.id);
                const status = saved ? saved.status : 'Presente';
                const obs = saved ? saved.obs : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${f.nome}</strong><br><span class="info-sub">${f.cargo}</span></td>
                    <td>
                        <select class="status-presenca" data-id="${f.id}" style="width: 100%;">
                            <option value="Presente" ${status === 'Presente' ? 'selected' : ''}>Presente</option>
                            <option value="Falta" ${status === 'Falta' ? 'selected' : ''} style="color:red">Falta</option>
                            <option value="Atestado" ${status === 'Atestado' ? 'selected' : ''} style="color:blue">Atestado</option>
                            <option value="Folga" ${status === 'Folga' ? 'selected' : ''} style="color:green">Folga</option>
                        </select>
                    </td>
                    <td><input type="text" class="obs-presenca" value="${obs}" placeholder="Obs..."></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function salvarPresencaDia() {
            const data = document.getElementById('dataPresenca').value;
            const linhas = document.querySelectorAll('#tbodyPresenca tr');
            const listaDia = [];

            linhas.forEach(tr => {
                const select = tr.querySelector('.status-presenca');
                const obsInput = tr.querySelector('.obs-presenca');
                listaDia.push({
                    id: parseInt(select.getAttribute('data-id')),
                    status: select.value,
                    obs: obsInput.value
                });
            });

            db.presencas[data] = listaDia;
            salvarLocal();
            alert(`Presença salva para ${fmtData(data)}!`);
        }

        // --- PAGAMENTOS ---
        function getTotalPagoNoMes(idFunc, dataReferencia) {
            const dataRef = new Date(dataReferencia);
            const mesRef = dataRef.getUTCMonth();
            const anoRef = dataRef.getUTCFullYear();

            return db.pagamentos
                .filter(p => {
                    const d = new Date(p.data);
                    return p.idFunc == idFunc && d.getUTCMonth() == mesRef && d.getUTCFullYear() == anoRef;
                })
                .reduce((acc, p) => acc + p.valor, 0);
        }

        function mostrarSaldoRestante() {
            const idFunc = document.getElementById('selectFuncionarioPagamento').value;
            const data = document.getElementById('dataPagamento').value;
            const divAviso = document.getElementById('avisoSaldo');
            
            if (!idFunc || !data) {
                divAviso.style.display = 'none';
                return;
            }

            const func = db.funcionarios.find(f => f.id == idFunc);
            const totalPago = getTotalPagoNoMes(idFunc, data);
            const restante = func.salario - totalPago;

            let extraInfo = '';
            if(func.pix) extraInfo = `<br>🔑 <strong>Chave Pix:</strong> ${func.pix}`;

            divAviso.style.display = 'block';
            if (restante <= 0) {
                divAviso.style.backgroundColor = '#f8d7da';
                divAviso.style.color = '#721c24';
                divAviso.style.border = '1px solid #f5c6cb';
                divAviso.innerHTML = `🛑 <strong>Limite Atingido!</strong>${extraInfo}<br>Salário: ${fmtMoeda(func.salario)} | Pago no mês: ${fmtMoeda(totalPago)}`;
            } else {
                divAviso.style.backgroundColor = '#d4edda';
                divAviso.style.color = '#155724';
                divAviso.style.border = '1px solid #c3e6cb';
                divAviso.innerHTML = `✅ <strong>Disponível: ${fmtMoeda(restante)}</strong>${extraInfo}<br><small>Salário Base: ${fmtMoeda(func.salario)} | Já Pago: ${fmtMoeda(totalPago)}</small>`;
            }
        }

        function lancarPagamento() {
            const idFunc = document.getElementById('selectFuncionarioPagamento').value;
            const valorInput = document.getElementById('valorPagamento').value;
            const data = document.getElementById('dataPagamento').value;
            const desc = document.getElementById('descPagamento').value;

            if(!idFunc || !valorInput || !data) return alert("Preencha Funcionario, Valor e Data!");

            const valor = parseFloat(valorInput);
            const func = db.funcionarios.find(f => f.id == idFunc);
            const totalJaPago = getTotalPagoNoMes(idFunc, data);
            
            if (totalJaPago + valor > func.salario) {
                const restante = func.salario - totalJaPago;
                return alert(`BLOQUEADO: O valor excede o salário mensal.\n\nDisponível: ${fmtMoeda(restante)}\nTentativa: ${fmtMoeda(valor)}`);
            }

            db.pagamentos.push({
                id: Date.now(),
                idFunc: parseInt(idFunc),
                nomeFunc: func.nome,
                valor: valor,
                data: data,
                desc: desc
            });

            salvarLocal();
            atualizarInterface();
            mostrarSaldoRestante();
            
            document.getElementById('valorPagamento').value = '';
            document.getElementById('descPagamento').value = '';
            alert("Pagamento registrado!");
        }

        function removerPagamento(id) {
            if(confirm("Cancelar este pagamento?")) {
                db.pagamentos = db.pagamentos.filter(p => p.id !== id);
                salvarLocal();
                atualizarInterface();
                mostrarSaldoRestante();
            }
        }

        // --- UI UPDATES ---
        function atualizarInterface() {
            // TABELA FUNCIONARIOS
            const tbFunc = document.getElementById('tabelaFuncionarios').querySelector('tbody');
            tbFunc.innerHTML = '';
            
            const selectPag = document.getElementById('selectFuncionarioPagamento');
            const selectionAtual = selectPag.value; 
            selectPag.innerHTML = '<option value="">Selecione o Funcionário...</option>';

            db.funcionarios.forEach(f => {
                const cpfDisplay = f.cpf ? `<br><span class="info-sub">CPF: ${f.cpf}</span>` : '';
                const contatoDisplay = f.tel ? `📞 ${f.tel}` : '<span style="color:#ccc">Sem tel</span>';
                const endDisplay = f.end ? `<br><span class="info-sub">🏠 ${f.end}</span>` : '';
                const dataEntrada = f.entrada ? `<br><span class="info-sub">Entrou: ${fmtData(f.entrada)}</span>` : '';
                
                // Exibição do PIX com botão de copiar
                const pixDisplay = f.pix ? 
                    `<br><div class="info-pix">Pix: ${f.pix}</div> <button class="btn-copy" onclick="copiarTexto('${f.pix}')">Copiar</button>` : '';

                tbFunc.innerHTML += `
                    <tr>
                        <td><strong>${f.nome}</strong>${cpfDisplay}</td>
                        <td>${f.cargo}${dataEntrada}</td>
                        <td>${contatoDisplay}${pixDisplay}${endDisplay}</td>
                        <td style="color:var(--success); font-weight:bold;">${fmtMoeda(f.salario)}</td>
                        <td><button class="action-btn" style="background:#e74c3c; padding: 5px 10px;" onclick="removerFuncionario(${f.id})">🗑️</button></td>
                    </tr>
                `;
                
                selectPag.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
            });
            selectPag.value = selectionAtual;

            // TABELA PAGAMENTOS
            const tbPag = document.getElementById('tabelaPagamentos').querySelector('tbody');
            tbPag.innerHTML = '';
            const pagsOrdenados = [...db.pagamentos].sort((a, b) => new Date(b.data) - new Date(a.data));

            pagsOrdenados.forEach(p => {
                tbPag.innerHTML += `
                    <tr>
                        <td>${fmtData(p.data)}</td>
                        <td><strong>${p.nomeFunc}</strong></td>
                        <td>${p.desc || '-'}</td>
                        <td style="color: var(--success); font-weight:bold;">${fmtMoeda(p.valor)}</td>
                        <td><button class="action-btn" style="background:#e74c3c; padding:4px 8px; font-size:0.8rem;" onclick="removerPagamento(${p.id})">X</button></td>
                    </tr>
                `;
            });
        }

        // --- SISTEMA ---
        function salvarLocal() { localStorage.setItem('rh_db_v4', JSON.stringify(db)); }

        function salvarDados() {
            const dataStr = JSON.stringify(db, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_rh_pix_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function carregarDados(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    db = JSON.parse(e.target.result);
                    db.funcionarios.forEach(f => {
                         if(!f.cpf) f.cpf = ''; if(!f.tel) f.tel = ''; if(!f.end) f.end = ''; 
                         if(!f.nasc) f.nasc = ''; if(!f.entrada) f.entrada = ''; if(!f.pix) f.pix = '';
                    });
                    salvarLocal();
                    atualizarInterface();
                    alert("Backup restaurado!");
                } catch (err) { alert("Erro ao ler arquivo."); }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
